name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar la app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MiEmprendimiento.apk

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: MiEmprendimiento-apk
          path: MiEmprendimiento.apk

      - name: Publicar enlace de descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Mi Emprendimiento v1.${{ github.run_number }}
          body: |
            Descarga **MiEmprendimiento.apk** desde tu celular Android e instálalo.
            Si ya tenías la app instalada, se actualiza sin perder tus datos.
          files: MiEmprendimiento.apk
          make_latest: true
