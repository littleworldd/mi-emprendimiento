plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.susana.emprendimiento'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.susana.emprendimiento'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Firma fija: permite instalar actualizaciones sin perder los datos.
    signingConfigs {
        susana {
            storeFile file('susana.keystore')
            storePassword 'susana2026'
            keyAlias 'susana'
            keyPassword 'susana2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.susana
        }
        debug {
            signingConfig signingConfigs.susana
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
